services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: furnifind
      POSTGRES_USER: furnifind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env}
    ports:
      - "5432:5432"
    volumes:
      - furnifind_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furnifind -d furnifind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furnifind_data:
